version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Keep the Cloudflare toolchain moving together (wrangler, miniflare, vitest plugin).
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-*", "prettier"]
      test:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom"]
      radix:
        patterns: ["@radix-ui/*"]
    ignore:
      # MediaPipe is pinned exactly: the self-hosted wasm and the model must be
      # upgraded together and re-verified in the browser.
      - dependency-name: "@mediapipe/tasks-vision"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
